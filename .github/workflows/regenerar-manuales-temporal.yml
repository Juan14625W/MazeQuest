name: Regenerar manuales PDF
on:
  push:
    branches:
      - docs/sincronizar-integrantes-grupo
      - main
permissions:
  contents: write
jobs:
  regenerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias de documentación
        run: python -m pip install -r scripts/requirements-docs.txt
      - name: Generar los dos PDF desde las fuentes actuales
        run: python scripts/build_manuals.py
      - name: Validar nombres, metadatos y páginas
        run: |
          python - <<'PY'
          import pymupdf
          team = ('Juan David Paz Rodriguez', 'José Ángel Lopez Paz', 'Carolina Diago Fernandez')
          for name in ('manual-usuario', 'manual-tecnico'):
              path = f'output/pdf/{name}.pdf'
              with pymupdf.open(path) as doc:
                  txt = '\n'.join(page.get_text() for page in doc)
                  metadata = doc.metadata.get('author', '')
                  for person in team:
                      assert person in txt, f'{name}: falta {person} en contenido'
                      assert person in metadata, f'{name}: falta {person} en metadatos'
                  assert 'Andrea Fernanda Sapuyez' not in txt + metadata, f'{name}: nombre antiguo presente'
                  assert all(page.get_text().strip() for page in doc), f'{name}: página sin texto'
                  print(f'{path}: OK, {len(doc)} páginas')
          PY
      - name: Guardar PDF actualizados
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/pdf/manual-usuario.pdf output/pdf/manual-tecnico.pdf
          if ! git diff --cached --quiet; then
            git commit -m "docs: regenerar PDF con integrantes actuales"
            git push origin HEAD:${GITHUB_REF_NAME}
          else
            echo "Los PDF ya están actualizados"
          fi
